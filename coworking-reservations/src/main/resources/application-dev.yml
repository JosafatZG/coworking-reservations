spring:
  datasource:
    url: jdbc:h2:mem:coworking
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true

app:
  security:
    jwt:
      secret: ${JWT_SECRET}

  payment:
    mock:
      mode: FAILURE
      delay: 0ms